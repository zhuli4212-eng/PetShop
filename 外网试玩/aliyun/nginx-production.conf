worker_processes 1;
pid /run/petshop-web/nginx.pid;
error_log stderr warn;

events { worker_connections 256; }

http {
    access_log off;
    default_type application/octet-stream;
    types {
        text/html html;
        text/plain txt;
        text/css css;
        application/javascript js mjs;
        application/json json;
        application/wasm wasm;
        image/png png;
    }
    client_body_temp_path client_body;
    proxy_temp_path proxy;
    fastcgi_temp_path fastcgi;
    uwsgi_temp_path uwsgi;
    scgi_temp_path scgi;

    server {
        listen 443 ssl;
        server_name petshop.zhu-li-4212.xyz;
        ssl_certificate /etc/petshop/tls/fullchain.pem;
        ssl_certificate_key /etc/petshop/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /opt/petshop/current/public;
        index index.html;
        charset utf-8;
        if ($host != petshop.zhu-li-4212.xyz) { return 421; }
        include /etc/petshop/origin-gate.conf;

        location /petshop-api/v1/ {
            client_max_body_size 2m;
            proxy_pass http://127.0.0.1:8788;
            proxy_http_version 1.1;
            proxy_set_header Host petshop.zhu-li-4212.xyz;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Petshop-Origin-Secret $http_x_petshop_origin_secret;
            proxy_set_header X-Petshop-Client-IP $http_x_petshop_client_ip;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header Connection "";
        }
        location / { try_files $uri $uri/ =404; }
    }
}
