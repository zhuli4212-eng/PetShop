server {
    listen 443 ssl http2;
    server_name play.zhu-li-4212.xyz;
    if ($host != play.zhu-li-4212.xyz) { return 421; }

    ssl_certificate /etc/petshop/play-direct/tls/fullchain.pem;
    ssl_certificate_key /etc/petshop/play-direct/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm text/css text/plain;

    location = / { return 302 /petshop/; }
    location = /petshop { return 308 /petshop/; }

    location ^~ /petshop-api/v1/ {
        gzip off;
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host petshop.zhu-li-4212.xyz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Petshop-Origin-Secret "";
        proxy_set_header X-Petshop-Client-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Connection "";
    }
    location = /petshop/index.html {
        alias /opt/petshop/current/public/index.html;
        add_header Cache-Control "no-cache" always;
        etag off;
        if_modified_since off;
    }
    location = /petshop/release.json {
        alias /opt/petshop/current/public/release.json;
        add_header Cache-Control "no-store" always;
        etag off;
        if_modified_since off;
    }
    location ~ "^/petshop/(assets/resources/native/[0-9a-f]{2}/[0-9a-f-]+\.[0-9a-f]{16}\.woff2)$" {
        alias /opt/petshop/current/public/$1;
        default_type font/woff2;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /petshop/ { alias /opt/petshop/current/public/; }
    location / { return 404; }
}
