[Service]
ExecStartPre=
ExecStartPre=/usr/bin/python3 /etc/petshop/play-direct/compose-play-nginx.py /opt/petshop/current/nginx-production.conf /etc/petshop/play-direct/play-direct.conf /run/petshop-web/player-nginx.conf
ExecStartPre=/opt/petshop/current/nginx -t -p /run/petshop-web/ -c /run/petshop-web/player-nginx.conf
ExecStart=
ExecStart=/opt/petshop/current/nginx -g "daemon off;" -p /run/petshop-web/ -c /run/petshop-web/player-nginx.conf
