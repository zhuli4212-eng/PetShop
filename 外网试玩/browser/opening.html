<template id="login-opening">
  <div id="opening" role="region" aria-label="麦穗宠物店开场动画">
    <div class="intro-stage">
      <div class="intro-world">
        <picture>
          <source media="(min-aspect-ratio: 1/1)" srcset="./opening/shopfront-wide.png">
          <img class="intro-bg" src="./opening/shopfront.png" alt="">
        </picture>
        <div class="intro-animals" aria-label="门前散步的小兔、柴犬和小猫">
          <span class="intro-pet intro-pet-rabbit"><img src="./opening/rabbit.png" alt="白色垂耳兔"></span>
          <span class="intro-pet intro-pet-dog"><img src="./opening/dog.png" alt="赤色柴犬"></span>
          <span class="intro-pet intro-pet-cat"><img src="./opening/cat.png" alt="黑白猫"></span>
        </div>
      </div>
      <div class="intro-sweep"></div>
      <div class="intro-mail"><img src="./opening/envelope.png" alt=""><span class="intro-glow"></span></div>
      <div class="intro-dim"></div>
      <div class="intro-title"><h1>麦穗宠物店</h1><p>新店主，请进</p></div>
      <div class="intro-cap" aria-live="polite" hidden></div>
      <div class="intro-fade"></div>
      <button class="intro-skip" type="button">跳过</button>
    </div>
  </div>
</template>
